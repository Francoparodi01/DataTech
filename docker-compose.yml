services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - datatech_mongo:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: datatech
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  datatech_mongo:
